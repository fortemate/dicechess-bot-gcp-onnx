[tools]
java = "temurin-25"
sbt = "2.0.8" # sbt runner; MUST match sbt.version in project/build.properties (also provisions the Jules VM)
lefthook = "latest"
betterleaks = "latest"
scalafmt = "3.11.1"
actionlint = "1.7.12"
gh = "latest"
jq = "latest"

[tasks.setup]
description = "Install build tooling and register Git hooks"
depends = ["hook:install"]

[tasks.compile]
description = "Compile main and test sources"
run = "sbt 'compile; Test / compile'"

[tasks.test]
description = "Run the complete test suite"
run = "sbt testAll"

[tasks.check]
description = "Run all local quality gates"
run = """
sbt 'scalafixAll --check; clean; scalafmtCheckAll; testAll'
./tests/validate-published-image-test.sh
"""

[tasks.assembly]
description = "Build the runnable fat jar"
run = "sbt assembly"

[tasks.run]
description = "Run the webhook bot locally"
run = "sbt run"

[tasks.clean]
description = "Remove build artifacts"
run = "sbt clean"

[tasks.format]
description = "Format and apply safe Scala rewrites"
run = "sbt 'scalafmtAll; scalafixAll'"

[tasks."format:check"]
description = "Verify Scala and sbt formatting"
run = "sbt scalafmtCheckAll"

[tasks."hook:install"]
description = "Register Git hooks via lefthook"
run = "lefthook install"

[tasks."hook:run"]
description = "Run all pre-commit hooks over tracked files"
run = "lefthook run pre-commit --all-files"
