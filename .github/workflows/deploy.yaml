name: "CD: Publish Bot Image"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Verify release tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Select a vX.Y.Z tag when running this workflow; got '$RELEASE_REF'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7

      - name: Run validation and build fat jar
        run: sbt 'scalafixAll --check; clean; scalafmtCheckAll; testAll; assembly'

      - name: Smoke-test runnable jar
        run: |
          set -euo pipefail
          DICECHESS_WEBHOOK_SECRET=smoke PORT=8099 \
            java --enable-native-access=ALL-UNNAMED \
              -jar target/out/jvm/scala-3.8.4/dicechess-bot-gcp-onnx/dicechess-bot-gcp-onnx.jar &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          response=""

          for attempt in {1..20}; do
            if response=$(curl --fail --silent --show-error \
              --request POST http://127.0.0.1:8099/api/webhook \
              --header "Content-Type: application/json" \
              --data '{"type":"verification","nonce":"ci-smoke"}'); then
              break
            fi
            sleep 1
          done

          if [[ -z "$response" ]]; then
            echo "::error::Bot did not become ready."
            exit 1
          fi
          echo "Handshake response: $response"
          jq --exit-status '.nonce == "ci-smoke"' <<<"$response"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.authors=Fortemate

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
