name: "CD: Publish Bot Image"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Verify release tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Select a vX.Y.Z tag when running this workflow; got '$RELEASE_REF'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Run validation and build fat jar
        run: sbt 'scalafixAll --check; clean; scalafmtCheckAll; testAll; assembly'

      - name: Smoke-test runnable jar
        run: |
          set -euo pipefail
          DICECHESS_WEBHOOK_SECRET=smoke PORT=8099 \
            java --enable-native-access=ALL-UNNAMED \
              -jar target/out/jvm/scala-3.8.4/dicechess-bot-gcp-onnx/dicechess-bot-gcp-onnx.jar &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          response=""

          for attempt in {1..20}; do
            if response=$(curl --fail --silent --show-error \
              --request POST http://127.0.0.1:8099/api/webhook \
              --header "Content-Type: application/json" \
              --data '{"type":"verification","nonce":"ci-smoke"}'); then
              break
            fi
            sleep 1
          done

          if [[ -z "$response" ]]; then
            echo "::error::Bot did not become ready."
            exit 1
          fi
          echo "Handshake response: $response"
          jq --exit-status '.nonce == "ci-smoke"' <<<"$response"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Dice Chess ONNX webhook bot
            org.opencontainers.image.description=ONNX expectimax Dice Chess bot with model pre-ranking, Star pruning, TT, and root rescoring
            org.opencontainers.image.url=https://github.com/fortemate/dicechess-bot-gcp-onnx
            org.opencontainers.image.source=https://github.com/fortemate/dicechess-bot-gcp-onnx
            org.opencontainers.image.documentation=https://github.com/fortemate/dicechess-bot-gcp-onnx#readme
            org.opencontainers.image.vendor=Fortemate
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.authors=Jegors Čemisovs
            org.opencontainers.image.base.name=docker.io/library/eclipse-temurin:25-jre-noble
          annotations: |
            org.opencontainers.image.title=Dice Chess ONNX webhook bot
            org.opencontainers.image.description=ONNX expectimax Dice Chess bot with model pre-ranking, Star pruning, TT, and root rescoring
            org.opencontainers.image.url=https://github.com/fortemate/dicechess-bot-gcp-onnx
            org.opencontainers.image.source=https://github.com/fortemate/dicechess-bot-gcp-onnx
            org.opencontainers.image.documentation=https://github.com/fortemate/dicechess-bot-gcp-onnx#readme
            org.opencontainers.image.vendor=Fortemate
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.authors=Jegors Čemisovs
            org.opencontainers.image.base.name=docker.io/library/eclipse-temurin:25-jre-noble

      - name: Build amd64 image for smoke testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dicechess-bot-gcp-onnx:smoke
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the hardened container and a signed synthetic-model turn
        run: |
          set -euo pipefail
          docker run --detach --name bot-smoke \
            --publish 127.0.0.1:8099:8080 \
            --read-only --tmpfs /tmp:rw,nosuid,exec,size=256m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 1g --memory-swap 1g --cpus 2 \
            --env DICECHESS_WEBHOOK_SECRET=smoke \
            --env DEFAULT_THINK_MS=200 \
            --env SEARCH_MODE=expectimax \
            --env PRE_RANK_WITH_MODEL=true \
            --env TT_ENABLED=true \
            --env TT_CAPACITY=1024 \
            dicechess-bot-gcp-onnx:smoke
          trap 'docker logs bot-smoke; docker rm -f bot-smoke' EXIT

          test "$(docker exec bot-smoke id -u)" = "10001"
          response=""
          for attempt in {1..30}; do
            if response=$(curl --fail --silent --show-error \
              --request POST http://127.0.0.1:8099/api/webhook \
              --header "Content-Type: application/json" \
              --data '{"type":"verification","nonce":"container-smoke"}'); then
              break
            fi
            sleep 1
          done
          jq --exit-status '.nonce == "container-smoke"' <<<"$response"

          body='{"type":"yourTurn","gameId":"smoke-game","seat":"White","state":{"dfen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1 NBK","clocks":{"white":5000,"black":5000},"timeControl":{"Fischer":{"initialSeconds":300,"incrementSeconds":3}}}}'
          timestamp=$(date +%s)
          signature=$(printf '%s' "${timestamp}.${body}" | openssl dgst -sha256 -hmac smoke -hex | awk '{print $2}')
          turn=$(curl --fail --silent --show-error \
            --request POST http://127.0.0.1:8099/api/webhook \
            --header "Content-Type: application/json" \
            --header "x-dicechess-timestamp: $timestamp" \
            --header "x-dicechess-signature: $signature" \
            --data "$body")
          jq --exit-status '.moves | type == "array" and length > 0' <<<"$turn"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max,version=v1
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Validate the published multi-arch index and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ./scripts/validate-published-image.sh \
            --release-tag "$GITHUB_REF_NAME" \
            --source-revision "$GITHUB_SHA" \
            --image-digest "$IMAGE_DIGEST"
