name: "Ops: Release"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Verify release branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be cut from main, not '$RELEASE_REF'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Run validation
        run: sbt 'scalafixAll --check; clean; scalafmtCheckAll; testAll'

      - name: Resolve release version
        id: version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            let latestTag = 'v0.0.0';
            try {
              latestTag = execFileSync(
                'git',
                ['describe', '--tags', '--abbrev=0', '--match', 'v[0-9]*.[0-9]*.[0-9]*'],
                { encoding: 'utf8' }
              ).trim();
            } catch {
              core.info('No existing semantic-version tag; starting at v0.1.0.');
            }

            const match = latestTag.match(/^v(\d+)\.(\d+)\.(\d+)$/);
            if (!match) {
              core.setFailed(`Latest release tag '${latestTag}' is not vX.Y.Z.`);
              return;
            }

            let [, major, minor, patch] = match.map(Number);
            if (latestTag === 'v0.0.0') {
              if (process.env.BUMP_TYPE === 'major') {
                major = 1;
                minor = 0;
              } else if (process.env.BUMP_TYPE === 'minor') {
                minor = 2;
              } else {
                minor = 1;
              }
            } else if (process.env.BUMP_TYPE === 'major') {
              major += 1;
              minor = 0;
              patch = 0;
            } else if (process.env.BUMP_TYPE === 'minor') {
              minor += 1;
              patch = 0;
            } else {
              patch += 1;
            }

            const tag = `v${major}.${minor}.${patch}`;
            core.setOutput('tag', tag);
            core.info(`Release tag: ${tag}`);

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG"

      - name: Publish release image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run deploy.yaml --ref "$RELEASE_TAG"
