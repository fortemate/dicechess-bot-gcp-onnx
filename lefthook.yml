pre-commit:
  parallel: false
  jobs:
    - name: betterleaks
      run: betterleaks git --pre-commit --redact --staged

    - name: scalafmt
      glob: "**.{scala,sbt}"
      run: scalafmt --test {staged_files}

    - name: workflow-yaml
      glob: ".github/workflows/*.y*ml"
      run: actionlint -shellcheck= {staged_files}

pre-push:
  jobs:
    - name: scalafmt-all
      glob: "**.{scala,sbt}"
      run: scalafmt --test .
